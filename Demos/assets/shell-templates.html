<!-- 
  ========================================================================
  aTrust / SASE 双底座与中英文切换组件模版 (shell-templates.html)
  使用说明：在 Demo HTML 引入 css/js 资产后，直接粘贴本组件模版骨架。
  ========================================================================
-->

<!-- 1. 右下角浮动切换 Bar (脱离文档流，默认收起，悬浮展开) -->
<div class="demo-switcher-bar" 
     x-data="{ expanded: false }" 
     @mouseenter="expanded = true" 
     @mouseleave="expanded = false" 
     x-cloak>
  <!-- 收起状态：极简 Mini Badge -->
  <div class="demo-switcher-collapsed" x-show="!expanded" x-transition.opacity.duration.150ms>
    <svg class="w-3.5 h-3.5 text-slate-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
    </svg>
    <span class="text-[11px] font-medium text-slate-600" x-text="(shell === 'atrust' ? 'aTrust' : 'SASE') + ' · ' + (lang === 'zh' ? '中文' : 'EN')"></span>
  </div>

  <!-- 展开状态：完整切换面板 -->
  <div class="demo-switcher-expanded-content" x-show="expanded" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100">
    <div class="demo-switcher-group">
      <button class="demo-switcher-btn" :class="shell === 'atrust' ? 'active' : ''" @click="setShell('atrust')">aTrust</button>
      <button class="demo-switcher-btn" :class="shell === 'sase' ? 'active' : ''" @click="setShell('sase')">SASE</button>
    </div>
    <div class="demo-switcher-divider"></div>
    <div class="demo-switcher-group">
      <button class="demo-switcher-btn" :class="lang === 'zh' ? 'active' : ''" @click="setLang('zh')">中文</button>
      <button class="demo-switcher-btn" :class="lang === 'en' ? 'active' : ''" @click="setLang('en')">EN</button>
    </div>
  </div>
</div>

<!-- 2. aTrust 导航外壳 (<template x-if="shell === 'atrust'">) -->
<template x-if="shell === 'atrust'">
  <div class="flex flex-col w-full h-full">
    <!-- aTrust Header (56px) -->
    <header class="h-[56px] min-h-[56px] bg-white border-b border-bg-line flex items-center px-4 flex-shrink-0 z-30">
      <div class="flex items-center w-[280px] flex-shrink-0">
        <img src="https://i.imgur.com/jrWvSot.png" alt="Logo" class="w-[40px] h-[40px] object-contain flex-shrink-0">
        <span class="ml-3 text-lg font-semibold text-text-title whitespace-nowrap" x-text="t('productNameAtrust')"></span>
      </div>

      <!-- 顶部 NavCenter Tab -->
      <div class="flex-1 flex justify-center overflow-hidden min-w-0 px-2">
        <div class="flex items-center gap-1 overflow-x-auto no-scrollbar">
          <div class="at-top-nav-item active" x-text="t('globalAcceleration')"></div>
        </div>
      </div>

      <!-- 右侧用户入口 -->
      <div class="flex items-center gap-4 w-[280px] justify-end pr-4">
        <div class="flex items-center gap-2 cursor-pointer">
          <div class="w-6 h-6 rounded-full bg-brand text-white flex items-center justify-center font-semibold text-xs">A</div>
          <span class="text-xs font-medium text-text-title" x-text="t('userAdmin')"></span>
        </div>
      </div>
    </header>

    <!-- App Layout Shell (aTrust 侧边栏 + 工作区) -->
    <div class="flex-1 flex overflow-hidden">
      <!-- aTrust 侧边栏 (240px) -->
      <aside class="at-sider flex flex-col flex-shrink-0 select-none">
        <div class="at-sider-title flex-shrink-0">
          <span x-text="t('globalAcceleration')"></span>
        </div>
        <div class="flex-1 overflow-y-auto py-2 custom-scrollbar">
          <div class="at-menu-l2" :class="activeLeaf === 'accel-usage-stats' ? 'active' : ''" @click="activeLeaf = 'accel-usage-stats'">
            <span class="ml-6" x-text="t('accelUsageStats')"></span>
          </div>
          <div class="at-menu-l2" :class="activeLeaf === 'accel-config' ? 'active' : ''" @click="activeLeaf = 'accel-config'">
            <span class="ml-6" x-text="t('accelConfig')"></span>
          </div>
        </div>
      </aside>

      <!-- 右侧工作区插槽挂载区 -->
      <main class="flex-1 bg-bg-light flex flex-col overflow-hidden">
        <!-- 页头 Bar (48px) -->
        <div class="h-12 bg-white border-b border-bg-line flex items-center pl-4 flex-shrink-0 select-none">
          <span class="text-xs font-semibold text-text-title" x-text="activeLeaf === 'accel-config' ? t('accelConfig') : t('accelUsageStats')"></span>
        </div>
        <!-- 业务内容区 -->
        <div class="flex-1 p-3 flex flex-col overflow-hidden">
          <div class="bg-white rounded-sm shadow-sm flex-1 flex flex-col overflow-hidden p-3" id="atrust-workspace-slot">
            <!-- 业务组件插入位置 -->
          </div>
        </div>
      </main>
    </div>
  </div>
</template>
